<!-- HERO SPLIT: page opener. Section background: forest #182820 (set in the section toolbar).
     Left: eyebrow, headline, intro, buttons. Right: a portrait photo. Stacks on phones. -->
<div class="connect-template align-left w-100">
  <div class="template-split">
    <div class="template-wide">
      <div class="template-eyebrow text-color-light" style="color:#f0c77b!important">Small line above the headline</div>
      <div class="prompt-text pt-2 h1 text-color-light">Headline goes here.</div>
      <div class="prompt-text pb-3 paragraph-1 text-color-light template-measure" style="margin-left:0">One or two sentences that introduce the page.</div>
      <div class="template-actions">
        <a class="btn btn-primary text-color-light" href="/upcoming_events">Primary button</a>
        <a class="btn template-btn-outline text-color-light" href="https://calvaryellicott.org/">Second button</a>
      </div>
    </div>
    <div class="template-auto template-media">
      <img src="PHOTO-URL" alt="" style="width:260px;max-width:100%;border-radius:14px">
    </div>
  </div>
</div>
