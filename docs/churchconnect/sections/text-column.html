<!-- TEXT COLUMN: a narrow, readable column for stories, announcements, policies. Light section background (paper #fbfaf5). -->
<div class="connect-template align-left w-100">
  <div class="template-measure" style="margin-left:0">
    <div class="template-eyebrow text-color-accent">Section label</div>
    <div class="prompt-text pt-2 h2 text-color-dark">Headline</div>
    <div class="paragraph-1 text-color-dark pb-2">A lead sentence that sets up what follows.</div>
    <div class="paragraph-2 text-color-dark pb-3">First paragraph. Keep paragraphs short; people read on phones.</div>
    <div class="paragraph-2 text-color-dark pb-3">Second paragraph.</div>
    <div class="template-actions"><a class="btn btn-primary text-color-light" href="#">Optional button</a></div>
  </div>
</div>
