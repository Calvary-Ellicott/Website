<!-- THREE TILES: label, heading, sentence, button in each. Works on light or dark section backgrounds.
     To add a tile, copy one <div class="template-tile">…</div>. Three per row on desktop, wraps on phones. -->
<div class="connect-template align-left w-100">
  <div class="template-eyebrow text-color-accent">Section label</div>
  <div class="prompt-text pt-2 pb-3 h2 text-color-dark">Section headline</div>
  <div class="template-grid template-grid-3">
    <div class="template-tile">
      <div class="template-tile-body">
        <div class="template-eyebrow text-color-accent">Label</div>
        <div class="h4 text-color-dark pt-2">Tile heading</div>
        <div class="paragraph-2 text-color-muted">One or two sentences.</div>
        <div class="template-actions mt-auto pt-3"><a class="btn template-btn-outline text-color-accent" href="#">Button</a></div>
      </div>
    </div>
    <div class="template-tile">
      <div class="template-tile-body">
        <div class="template-eyebrow text-color-accent">Label</div>
        <div class="h4 text-color-dark pt-2">Tile heading</div>

        <div class="template-actions mt-auto pt-3"><a class="btn template-btn-outline text-color-accent" href="#">Button</a></div>
      </div>
    </div>
    <div class="template-tile">
      <div class="template-tile-body">

  </div>
</div>
